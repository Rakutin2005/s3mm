s3mm {
    socket /run/s3mm/s3mm.sock;
    pid_file /run/s3mm/s3mmd.pid;
    cache_dir /var/cache/s3mm;
    secrets_dir /etc/s3mm/secrets;
    modules_dir /usr/lib/s3mm/modules;

    worker_count 0;
    permanent off;

    log { level info; facility daemon; socket /dev/log; }
    metrics 127.0.0.1:9108;

    scan { every 5m; bucket_every 0; }
    queue { size 1G; time 10m; min_size 1M; max_disk 50G; }
    transfer { parallel 4; retries 5; backoff 5s; rate_limit 0; }

    cluster rustfs1 { addr http://rustfs1:9000; alias rustfs1; vendor rustfs; credential rustfs-admin; location us-east-1; path_style on; insecure on; }
    cluster rustfs2 { addr http://rustfs2:9000; alias rustfs2; vendor rustfs; credential rustfs2-admin; location us-east-1; path_style on; insecure on; }
    cluster minio1 { addr http://minio1:9000; alias minio1; vendor minio; credential minio-admin; location us-east-1; path_style on; insecure on; }

    credential rustfs-admin { access_key rustfsadmin; secret_key rustfsadmin; region us-east-1; }
    credential rustfs2-admin { access_key r2admin; secret_key r2admin123; region us-east-1; }
    credential minio-admin { access_key minioadmin; secret_key minioadmin; region us-east-1; }

    s3mmws {
        auth_enabled on;
        session_ttl 3600;
        rbac_store /etc/s3mm/secrets/s3mmws_rbac.json;
        users_file /etc/s3mm/secrets/s3mmws_users.json;
        auth { local { enabled on; users_file /etc/s3mm/secrets/s3mmws_users.json; } ldap { enabled off; } keycloak { enabled off; } }
    }

    wscluster {
        enabled on;
        bind 0.0.0.0;
        port 9443;
        use_mtls on;
        certs_dir /etc/s3mm/secrets/cluster;
        cluster_secret testsecret;
    }
}
