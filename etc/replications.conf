# replications
replication photos {
    source minio1;
    destination aws1;
    buckets media*,!media/tmp/*;
    policy default;
    delete_propagation on;
    scan_every 5m;
    # metadata_every 5m;   # re-read tags/HTTP metadata; 0 => only on content change
    # retention 1h;        # delay object and bucket deletions
}
