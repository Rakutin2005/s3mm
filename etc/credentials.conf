# credentials (cluster-bound override global ones)
credential minio-admin {
    access_key AKIA_MINIO_ADMIN;
    secret_key_file /etc/s3mm/secrets/minio-admin.pem;
    region us-east-1;
}

credential aws-ro {
    access_key AKIA_AWS_RO;
    secret_key_file /etc/s3mm/secrets/aws-ro.pem;
    region us-east-1;
}
