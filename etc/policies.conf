# policies
policy default {
    default_action access accept;
    default_action bucket accept;
    default_action object accept;
    default_route denied null;
    default_route warning quarantine;
    default_route success "";
    rule '100 name=big object source.size >= 1M action accept log message="large object"';
    rule '200 name=small object source.size < 1M action accept';
}

policy drop-all {
    default_action access drop;
    default_action bucket drop;
    default_action object drop;
    default_route denied null;
    default_route warning quarantine;
    default_route success "";
}

policy strict {
    default_action access drop;
    default_action bucket drop;
    default_action object drop;
    default_route denied null;
    default_route warning quarantine;
    default_route success "";
    rule '10 name=allow-read acl source.subject = "trusted-*" action accept';
    rule '20 name=block-delete object source.key ~ "^tmp/" action drop';
    rule '30 name=quarantine-big object source.size >= 100M action quarantine';
}
