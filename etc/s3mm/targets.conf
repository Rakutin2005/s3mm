# ---------------------------------------------------------------------------
# targets.conf -- replication targets
# ---------------------------------------------------------------------------
# Define targets used by replications:
#
# target <name> {
#     cluster <cluster-name>;
#     bucket <bucket-name>;        # destination bucket
#     prefix <prefix>;             # optional destination prefix
#     storage_class <class>;       # optional
#     acl <canned|custom>;         # optional
# }
# ---------------------------------------------------------------------------

