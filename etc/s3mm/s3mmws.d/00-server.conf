# -----------------------------------------------------------------------------
# 00-server.conf -- Core paths and includes
# -----------------------------------------------------------------------------
# socket      - s3mmd control socket
# modules_dir - Modules directory
# secrets_dir - Secrets (users, RBAC, certs)
# -----------------------------------------------------------------------------

socket /run/s3mm/s3mm.sock;
modules_dir /usr/lib/s3mm/modules;
secrets_dir /etc/s3mm/secrets;

# Load cluster/credential info for S3 browser/proxy
include /etc/s3mm/s3mmd.d/20-clusters.conf;
include /etc/s3mm/s3mmd.d/25-credentials.conf;
