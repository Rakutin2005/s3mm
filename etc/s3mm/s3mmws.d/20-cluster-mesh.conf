# -----------------------------------------------------------------------------
# 20-cluster-mesh.conf -- Inter-s3mmws cluster mesh (optional)
# -----------------------------------------------------------------------------
# wscluster {
#   enabled     - Enable mesh communication
#   bind        - Listen address for mesh
#   port        - Mesh listen port
#   use_mtls    - Require mutual TLS between peers
#   certs_dir   - Directory with node.crt, node.key, ca.crt
#   cluster_secret - Shared authentication secret
# }
#
# Used for cross-node operations; requires TLS material in certs_dir.
# -----------------------------------------------------------------------------

wscluster {
    enabled off;
    bind 0.0.0.0;
    port 9443;
    use_mtls on;
    certs_dir /etc/s3mm/secrets/cluster;
    cluster_secret change-me;
}
