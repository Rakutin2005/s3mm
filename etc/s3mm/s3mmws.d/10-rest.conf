# -----------------------------------------------------------------------------
# 10-rest.conf -- REST server and authentication
# -----------------------------------------------------------------------------
# s3mmws {
#   auth_enabled   - Enable authentication globally
#   session_ttl    - Session lifetime in seconds
#   rbac_store     - JSON file with RBAC rules/roles
#   users_file     - Local users database (JSON)
# }
#
# auth {
#   local    { enabled on|off; users_file ...; }
#   ldap     { enabled on|off; url; bind_dn; base_dn; user_filter; ... }
#   keycloak { enabled on|off; issuer; client_id; client_secret; ... }
# }
# -----------------------------------------------------------------------------

s3mmws {
    auth_enabled on;
    session_ttl 3600;
    rbac_store /etc/s3mm/secrets/s3mmws_rbac.json;
    users_file /etc/s3mm/secrets/s3mmws_users.json;

    auth {
        local {
            enabled on;
            users_file /etc/s3mm/secrets/s3mmws_users.json;
        }
        ldap {
            enabled off;
            # url ldap://ldap.example.com:389;
            # bind_dn "cn=service-account,dc=example,dc=com";
            # bind_password "secret";            # inline password (less secure)
            # bind_password_file /etc/s3mm/secrets/ldap-bind.secret;  # preferred
            # base_dn "dc=example,dc=com";
            # user_filter "(uid=%s)";
            # group_search_base "ou=groups,dc=example,dc=com";
            # group_filter "(&(objectClass=groupOfNames)(member=%s))";
            # tls_ca /etc/s3mm/secrets/ldap-ca.crt;
        }
        keycloak {
            enabled off;
            # issuer "https://keycloak.example.com/realms/s3mm";
            # client_id "s3mmws";
            # client_secret "/etc/s3mm/secrets/keycloak-client.secret";
            # redirect_uri "https://s3mmws.example.com/auth/callback";
        }
    }
}
