# -----------------------------------------------------------------------------
# 30-modules.conf -- s3mmws extension modules
# -----------------------------------------------------------------------------
# module <name> { ... }
#
# s3mmws loads <modules_dir>/s3mmws_mod_<name>.so (or `path <file.so>;`) only
# for modules listed here, hands the block to the module and registers its
# REST routes under /ext/<name>/. A module may also contribute a page to the
# web UI: the UI asks GET /ui/extensions and shows the page in its navigation
# only while the module is loaded -- no UI rebuild is needed.
#
# Common directives:
#   path <file.so>;      # explicit module file (default: modules_dir lookup)
#
# Access: /ext/* routes require s3mmws:read (GET) / s3mmws:write (others).
# -----------------------------------------------------------------------------

# s3mmc -- cluster mesh client: status, peers, routes, visibility.
# Either point at the control socket directly ...
#   module s3mmc {
#       socket /var/run/s3mmc/node-a/s3mmc.sock;
#   }
# ... or at the s3mmc configuration (socket = <run_dir>/<node>/s3mmc.sock):
#   module s3mmc {
#       config /etc/s3mm/s3mmc.conf;
#       timeout 5s;
#   }
