# /etc/s3mm/s3mme.conf -- s3mme event broker client
node s3mme-1;
core_socket /run/s3mm/s3mm.sock;
run_dir /var/run/s3mme;
poll_interval 1s;
default_broker kafka;
send_all on;                 # send all routing decisions unless a policy filters

broker kafka {
    host localhost;
    port 9092;
    topic s3mm.events;
}

broker rabbitmq {
    host localhost;
    port 5672;
    user guest;
    pass guest;
    vhost /;
    exchange s3mm.events;
    routing_key s3mm.events;
    declare_exchange on;
    exchange_type topic;
    confirm off;
}
