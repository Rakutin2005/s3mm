# ---------------------------------------------------------------------------
# clusters.conf -- S3 cluster definitions
# ---------------------------------------------------------------------------
# cluster <name> {
#   addr <http|https>://<host>:<port>;   # S3 data endpoint (repeatable: failover
#                                        # in order; also unix:/path#http://host:port
#                                        # for a socket published by s3mmc)
#   vendor generic|minio|aws|ceph|rustfs;# vendor module for client tuning and
#                                        # the management (admin) API
#   credential <cred-name>;              # credential block(s) (25-credentials.conf);
#                                        # the first non-read-only one is used
#   location <region>;                   # region / location constraint
#   path_style on|off;                   # on: host/bucket/key, off: bucket.host/key
#   insecure on|off;                     # do not verify the TLS certificate (dev only)
#   alias <short>;                       # optional alias for CLI/policies
#   timeout 120s; connect_timeout 10s;   # per-request / connect timeouts
#   retries 5; rate_limit 0; parallel 4; part_size 16M;
#
#   managed on|off;                      # default: on
#   admin_endpoint <scheme>://<host>:<port>;  # management API endpoint (repeatable)
# }
#
# Managed vs unmanaged
#   managed on  -- s3mmd administers the cluster through its vendor module:
#                  accounts/IAM (sync-accounts, account sync of replications),
#                  bucket grants, policies. Requires `vendor` with a loaded
#                  module (minio, rustfs; aws/ceph have no account admin) and
#                  an admin-capable credential.
#   managed off -- the cluster is used through the S3 data plane only
#                  (buckets/objects/tags/ACL with the given credential); the
#                  admin API is never called, account sync is skipped.
#
# Management endpoint
#   The admin API is reached on `admin_endpoint` when given, otherwise on the
#   `addr` endpoints. The vendor module adds its own path prefix, so give only
#   scheme://host:port:
#     MinIO   -> <admin_endpoint>/minio/admin/v3/...
#     RustFS  -> <admin_endpoint>/rustfs/admin/v3/...
#   Use it when the admin API is published separately from the S3 traffic
#   (dedicated admin port, internal VIP, admin-only load balancer).
#   admin_endpoint is ignored (with a warning) when managed is off.
#
# Availability check
#   s3mmd checks every cluster at startup, after reload and after
#   `s3mm add|edit cluster` (in the background, results in syslog, "probe:"):
#   every addr gets a ListBuckets with the cluster credential (reachable /
#   credential rejected / unreachable), every admin_endpoint of a managed
#   cluster is checked for an HTTP answer. On demand: `s3mm check [cluster]`
#   (works without s3mmd as well); `s3mm s3 info <cluster>` adds bucket
#   contents.
# ---------------------------------------------------------------------------

cluster minio1 {
    addr http://127.0.0.1:9000;
    alias minio1;
    vendor minio;
    credential minio-admin;
    location us-east-1;
    path_style on;
    insecure on;   # set off in production with valid TLS
    managed on;    # admin API of the vendor module is used
    # admin_endpoint http://127.0.0.1:9000;  # default: same as addr
}

# Unmanaged: a foreign/third-party S3, data plane only.
# cluster partner-s3 {
#     addr https://s3.partner.example.com;
#     vendor generic;
#     credential partner-rw;
#     managed off;
# }

