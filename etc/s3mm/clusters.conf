# /etc/s3mm/clusters.conf -- cluster definitions
# cluster <name> { addr ...; vendor minio|aws|ceph|rustfs; credential <name>; ... }

cluster minio1 {
    addr http://127.0.0.1:19000;
    alias minio1;
    vendor minio;
    credential minio-admin;
    location us-east-1;
    path_style on;
    insecure on;              # allow self-signed / http
}
