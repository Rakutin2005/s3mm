# -----------------------------------------------------------------------------
# 10-scan-queue-transfer.conf -- Scanning, batching, queue, transfers
# -----------------------------------------------------------------------------
# SCAN
#   every        - Interval between discovery scans (e.g. 30s, 5m, 1h)
#   bucket_every - Scan every N bucket passes; 0 = scan buckets every pass
#
# QUEUE
#   size         - Soft queue size threshold (triggers flushing/batching)
#   time         - Max age of queued objects before flush
#   min_size     - Minimum total size to form a batch (objects < min_size may be delayed)
#   max_disk     - Hard on-disk budget for queue/spill. Exceeding => hold oldest safely.
#
# TRANSFER
#   parallel     - Concurrent S3 operations per worker
#   retries      - Retry count on transient/network errors
#   backoff      - Base retry backoff (exponential in effect)
#   rate_limit   - Global transfer rate limit in bytes/s, 0 = unlimited
# -----------------------------------------------------------------------------

scan {
    every 5m;
    bucket_every 0;
}

queue {
    size 1G;
    time 10m;
    min_size 1M;
    max_disk 50G;
}

transfer {
    parallel 4;
    retries 5;
    backoff 5s;
    rate_limit 0;
}
