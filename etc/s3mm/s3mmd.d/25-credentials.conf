# -----------------------------------------------------------------------------
# 25-credentials.conf -- Credentials for S3 clusters
# -----------------------------------------------------------------------------
# credential <name> {
#   access_key <AKID>;
#   secret_key <SECRET>;
#   session_token <TOKEN>;  # For temporary/STS credentials (optional)
#   region <REGION>;        # Default region (optional)
# }
#
# Reference from cluster: credential <name>;
# Store sensitive values securely; file permissions should be 0600.
# -----------------------------------------------------------------------------

credential minio-admin {
    access_key minioadmin;
    secret_key minioadmin;
    region us-east-1;
}
