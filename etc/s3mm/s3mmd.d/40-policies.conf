# -----------------------------------------------------------------------------
# 40-policies.conf -- Policy bundles (rule engine)
# -----------------------------------------------------------------------------
# Policy bundles contain ordered rules. Evaluation is first-match-wins unless
# action is 'pass' (falls through to next rule).
#
# Actions:
#   accept      - Replicate object
#   drop        - Discard object
#   quarantine  - Move to quarantine { bucket <b>; prefix <p>; }
#   redirect    - Redirect to different dest { cluster <c>; bucket <b>; prefix <p>; }
#   log         - Log match { level debug|info|notice|warning|error; }
#   set         - Modify metadata/attributes { metadata <k> <v>; }
#   propagate   - Propagate to additional targets
#   pass        - Fall through (must be alone)
#
# Match fields: source.bucket, source.key, source.size, destination.*, etc.
# Operators: == != ~ !~ >= <= > < and or not. Wildcards supported; '!' negates.
# min_size 1M is default behavior; can be overridden in rules/queue.
#
# Built-ins: drop-all, default (always available).
# -----------------------------------------------------------------------------

# policy example-filter {
#     rule {
#         match {
#             source.bucket "prod-*";
#             source.key "!*.tmp";
#             size >= 1M;
#         }
#         action log { level info; }
#         action accept;
#     }
#     rule {
#         match { source.key "*.log"; }
#         action drop;
#     }
# }
