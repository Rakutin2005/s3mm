# -----------------------------------------------------------------------------
# 50-replications.conf -- Replication routes
# -----------------------------------------------------------------------------
# replication <name> {
#   source <cluster>.<bucket>;           # Source cluster and bucket
#   destination <target-name>;          # or <cluster>.<bucket>
#   policy <bundle-name>;               # Policy bundle (e.g. default, example-filter)
#   enabled on|off;                     # Enable/disable route
# }
#
# Routing is controlled by policies and engine rules. Objects matched by
# an active replication are considered for policy evaluation.
# -----------------------------------------------------------------------------

# replication example-route {
#     source minio1.source-bucket;
#     destination backup-target;
#     policy default;
#     enabled on;
# }
