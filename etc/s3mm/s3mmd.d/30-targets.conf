# -----------------------------------------------------------------------------
# 30-targets.conf -- Replication targets (destination definitions)
# -----------------------------------------------------------------------------
# target <name> {
#   cluster <cluster-name>;    # Destination cluster
#   bucket <bucket-name>;      # Destination bucket
#   prefix <prefix>;           # Optional prefix prepended to keys
#   storage_class <class>;     # Optional S3 storage class
#   acl <acl>;                 # Optional canned/custom ACL
# }
#
# Referenced by replications: destination <target-name>;
# -----------------------------------------------------------------------------

