# -----------------------------------------------------------------------------
# 00-core.conf -- Core paths, scheduler, logging, metrics
# -----------------------------------------------------------------------------
# socket        - UNIX control socket for CLI (s3mm). Create dir with 0755, socket 0660.
# pid_file      - PID for systemd/service management
# cache_dir     - Persistent runtime cache (deltas, tombstones). Must be writable.
# secrets_dir   - TLS/keys/credentials. Restrict to 0700/0600.
# modules_dir   - Directory with s3mm_mod_*.so (minio/aws/ceph/rustfs/kafka/rabbitmq)
#
# worker_count  - Worker threads. 0 => one dedicated worker per policy bundle (recommended)
# permanent     - true/on/yes keeps runtime state; false/off by default
# -----------------------------------------------------------------------------

# PATHS
socket /run/s3mm/s3mm.sock;
pid_file /run/s3mm/s3mmd.pid;
cache_dir /var/cache/s3mm;
secrets_dir /etc/s3mm/secrets;
modules_dir /usr/lib/s3mm/modules;

# SCHEDULER
worker_count 0;        # 0 = per-policy dedicated workers
permanent off;         # off = apply config on reload as specified

# LOGGING (syslog RFC 5424 only)
log {
    level info;        # Options: debug | info | notice | warning | error | crit
    facility daemon;   # Syslog facility
    socket /dev/log;   # Syslog Unix socket
}

# METRICS (Prometheus)
metrics 127.0.0.1:9108; # Bind address:port. Comment to disable.
