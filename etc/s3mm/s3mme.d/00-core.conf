# -----------------------------------------------------------------------------
# 00-core.conf -- Core settings
# -----------------------------------------------------------------------------
# node            - Node identifier
# core_socket     - s3mmd control socket
# run_dir         - Runtime directory
# poll_interval   - How often to check for events
# default_broker  - Default broker if not specified in routing
# send_all        - Send all routing decisions unless policy filters
# -----------------------------------------------------------------------------

node s3mme-1;
core_socket /run/s3mm/s3mm.sock;
run_dir /var/run/s3mme;
poll_interval 1s;
default_broker kafka;
send_all on;
