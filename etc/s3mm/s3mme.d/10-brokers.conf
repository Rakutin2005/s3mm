# -----------------------------------------------------------------------------
# 10-brokers.conf -- Broker definitions
# -----------------------------------------------------------------------------
# broker kafka {
#   host localhost;
#   port 9092;
#   topic s3mm.events;
#   # SASL/TLS options as supported by module
# }
#
# broker rabbitmq {
#   host localhost;
#   port 5672;
#   user guest;
#   pass guest;
#   vhost /;
#   exchange s3mm.events;
#   routing_key s3mm.events;
#   exchange_type topic|direct|fanout|headers;
#   declare_exchange on|off;
#   confirm off|on;
# }
# -----------------------------------------------------------------------------

broker kafka {
    host localhost;
    port 9092;
    topic s3mm.events;
}

broker rabbitmq {
    host localhost;
    port 5672;
    user guest;
    pass guest;
    vhost /;
    exchange s3mm.events;
    routing_key s3mm.events;
    declare_exchange on;
    exchange_type topic;
    confirm off;
}
