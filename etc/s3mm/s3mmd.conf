# -----------------------------------------------------------------------------
# s3mmd.conf -- Main daemon configuration
# -----------------------------------------------------------------------------
# Purpose: Central replication engine (s3mmd). Control via CLI: s3mm
# Socket:  /run/s3mm/s3mm.sock (newline-delimited JSON protocol)
# Logs:    syslog RFC 5424 only (via log.socket)
# Cache:   /var/cache/s3mm
# Modules: /usr/lib/s3mm/modules
#
# This file is the entry point. It loads drop-in configs from s3mmd.d/ in
# lexicographic order (00-*.conf, 10-*.conf, ...). You can also include
# individual files. Order of includes/directives matters for some blocks.
#
# Quick start:
#   1. Edit s3mmd.d/00-core.conf for paths/scheduler/logging
#   2. Edit s3mmd.d/10-clusters.conf and 20-credentials.conf
#   3. Edit s3mmd.d/30-replications.conf and 40-policies.conf
#   4. Validate: s3mmd -t -c /etc/s3mm/s3mmd.conf
#   5. Start:     systemctl start s3mmd
#
# See README in this directory or man s3mmd(8) for full reference.
# -----------------------------------------------------------------------------

# Load all daemon drop-ins (numeric prefix controls order)
include /etc/s3mm/s3mmd.d/*.conf;
