# /etc/s3mm/s3mmd.conf -- s3mmd daemon configuration (base example)
# No outer "s3mm { }" wrapper: this file IS the daemon config.

# --- core paths ---
socket /run/s3mm/s3mm.sock;
pid_file /run/s3mm/s3mmd.pid;
cache_dir /var/cache/s3mm;
secrets_dir /etc/s3mm/secrets;
modules_dir /usr/lib/s3mm/modules;

# --- scheduler ---
worker_count 0;            # 0 => one dedicated worker per policy
permanent off;

# --- logging (syslog RFC 5424 only) ---
log {
    level info;             # debug | info | notice | warning | error
    facility daemon;
    socket /dev/log;
}

metrics 127.0.0.1:9108;    # Prometheus endpoint; remove to disable

# --- scanning / queueing ---
scan {
    every 5m;               # scan interval
    bucket_every 0;         # 0 => every scan
}

queue {
    size 1G;                # aggregate size threshold
    time 10m;               # time threshold
    min_size 1M;            # minimum batch size
    max_disk 50G;           # on-disk queue limit
}

transfer {
    parallel 4;
    retries 5;
    backoff 5s;
    rate_limit 0;           # 0 = unlimited
}

# --- included fragments ---
include /etc/s3mm/clusters.conf;
include /etc/s3mm/credentials.conf;
include /etc/s3mm/targets.conf;
include /etc/s3mm/replications.conf;
include /etc/s3mm/policies.conf;

