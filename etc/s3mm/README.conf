s3mm configuration layout
=========================

Main entry points:
- /etc/s3mm/s3mmd.conf   -> loads s3mmd.d/*.conf
- /etc/s3mm/s3mmws.conf  -> loads s3mmws.d/*.conf
- /etc/s3mm/s3mmc.conf   -> loads s3mmc.d/*.conf
- /etc/s3mm/s3mme.conf   -> loads s3mme.d/*.conf

Drop-in naming: NN-name.conf where NN = 00,10,20,... controls load order.
Edit only drop-ins or extend with new files - includes are globbed.

Secrets:
- Put sensitive files in /etc/s3mm/secrets/ with mode 0600
- Cluster TLS/materials in /etc/s3mm/secrets/cluster/

Validation:
- s3mmd -t -c /etc/s3mm/s3mmd.conf
- s3mmws -t -c /etc/s3mm/s3mmws.conf  (if supported)
- systemctl start s3mmd s3mmws s3mmc s3mme

Logging: syslog RFC 5424 only. Paths under /var/cache/s3mm and /run/s3mm.
