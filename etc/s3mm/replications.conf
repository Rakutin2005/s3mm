# ---------------------------------------------------------------------------
# replications.conf -- replication routes
# ---------------------------------------------------------------------------
# replication <name> {
#     source <cluster>.<bucket>;
#     destination <target-name> or <cluster>.<bucket>;
#     policy <bundle-name>;   # policy to apply, e.g. default or custom
#     enabled on|off;
#     # filters and options as supported
# }
#
# Multiple replications may share same source/destination.
# Use policies for filtering/branching.
# ---------------------------------------------------------------------------

# replication example {
#     source minio1.prod-data;
#     destination example-target;
#     policy default;
#     enabled on;
# }
