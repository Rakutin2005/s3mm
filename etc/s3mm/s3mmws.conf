# -----------------------------------------------------------------------------
# s3mmws.conf -- REST API daemon
# -----------------------------------------------------------------------------
# s3mmws provides HTTP REST API translating to s3mmd over Unix socket.
# Does NOT use "s3mm { }" wrapper. Loads drop-ins from s3mmws.d/.
#
# Defaults: listen as configured in s3mmws.d/00-server.conf
# Auth: Basic/JWT/LDAP/Keycloak as configured
# Cluster mesh: optional mTLS between s3mmws instances
# -----------------------------------------------------------------------------

include /etc/s3mm/s3mmws.d/*.conf;
