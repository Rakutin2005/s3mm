# /etc/s3mm/s3mmws.conf -- s3mmws REST daemon configuration (own config)
# s3mmws reads ONLY this file.

socket /run/s3mm/s3mm.sock;
modules_dir /usr/lib/s3mm/modules;
secrets_dir /etc/s3mm/secrets;

# clusters/credentials are needed for the S3 browser proxy
include /etc/s3mm/clusters.conf;
include /etc/s3mm/credentials.conf;

s3mmws {
    auth_enabled on;
    session_ttl 3600;
    rbac_store /etc/s3mm/secrets/s3mmws_rbac.json;
    users_file /etc/s3mm/secrets/s3mmws_users.json;
    auth {
        local { enabled on; users_file /etc/s3mm/secrets/s3mmws_users.json; }
        ldap { enabled off; }
        keycloak { enabled off; }
    }
}

wscluster {
    enabled off;
    bind 0.0.0.0;
    port 9443;
    use_mtls on;
    certs_dir /etc/s3mm/secrets/cluster;
    cluster_secret change-me;
}
