# /etc/s3mm/s3mmc.conf -- s3mmc cluster client configuration
node s3mmc-1;
run_dir /var/run/s3mmc;
core_socket /run/s3mm/s3mm.sock;
required_only on;            # bind remote sockets lazily
inventory both;              # push | pull | both
poll_interval 10s;
poll_timeout 30s;
core_timeout 30s;
listen 0.0.0.0:9443;

tls {
    cert /etc/s3mm/secrets/cluster/node.crt;
    key  /etc/s3mm/secrets/cluster/node.key;
    ca   /etc/s3mm/secrets/cluster/ca.crt;
}

peer s3mmc-2 {
    address http://127.0.0.1:8081;
    connect on;
    connect_timeout 10s;
}
