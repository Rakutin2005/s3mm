# -----------------------------------------------------------------------------
# 10-tls.conf -- mTLS configuration for peer mesh
# -----------------------------------------------------------------------------
# tls {
#   cert - Node certificate
#   key  - Node private key
#   ca   - CA certificate to verify peers
# }
# All files must be readable by s3mmc user.
# -----------------------------------------------------------------------------

tls {
    cert /etc/s3mm/secrets/cluster/node.crt;
    key  /etc/s3mm/secrets/cluster/node.key;
    ca   /etc/s3mm/secrets/cluster/ca.crt;
}
