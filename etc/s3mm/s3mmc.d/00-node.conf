# -----------------------------------------------------------------------------
# 00-node.conf -- Node identity and paths
# -----------------------------------------------------------------------------
# managed   - List of peer ids (CNs) allowed to MANAGE this node.
#             Managers may patch our config and pull credentials.
#             Value: comma/space separated list, "*" (everyone) or "none"/"off".
#             Example: managed "manager-1, manager-2";
#             If empty, no peer is a manager (safe default).
#
# To make a peer a manager of THIS node, add its id to `managed`.
# That peer dials us; we do NOT need to dial it back.
# -----------------------------------------------------------------------------

node s3mmc-1;
run_dir /var/run/s3mmc;
core_socket /run/s3mm/s3mm.sock;
required_only on;
inventory both;
poll_interval 10s;
poll_timeout 30s;
core_timeout 30s;
listen 0.0.0.0:9443;

# Managers of this node (peers that may connect and manage us):
# managed none;          # no managers (default, safe)
# managed "manager-1";   # allow manager-1 to manage us
# managed "*";           # allow any authenticated peer (use with care)
managed none;
EOF
echo "---"