# -----------------------------------------------------------------------------
# 20-peers.conf -- Peer definitions (outbound connections)
# -----------------------------------------------------------------------------
# peer <id> {
#   address         - http(s)://host:port of peer s3mmc
#   connect         - on|off - whether WE dial this peer (default on)
#   connect_timeout - Dial timeout
# }
#
# If you want this node to be MANAGED ONLY (no outbound dials), leave this
# file empty or set connect off for every peer. Inbound peers connect to us
# via our listen port (9443 by default) and must be listed in `managed`
# (see 00-node.conf) to gain manager privileges.
#
# Example (managed-only node, no outbound peers):
#   # (no peer blocks) — peers dial us; we listen only.
#
# Example (bidirectional peer):
#   peer s3mmc-2 {
#       address http://192.0.2.10:9443;
#       connect on;
#       connect_timeout 10s;
#   }
# -----------------------------------------------------------------------------

# No outbound peers: this node is managed-only.
# Add peer blocks here only if this node must initiate connections.
EOF
