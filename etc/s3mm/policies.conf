# ---------------------------------------------------------------------------
# policies.conf -- policy bundles (firewall-like rules)
# ---------------------------------------------------------------------------
# Bundles are evaluated in order. First match wins unless rule does 'pass'.
# Actions: accept, drop, quarantine, redirect, log, set, propagate, pass
# pass means "fall through to next rule" (cannot be combined with others).
#
# policy <bundle-name> {
#     rule {
#         match {
#             source.bucket "prod-*";
#             source.key "!*.tmp";
#             size >= 1M;
#             and { ... }
#             or  { ... }
#             not { ... }
#         }
#         action accept;
#         # action drop;
#         # action quarantine { bucket quarantine; prefix q/; }
#         # action redirect { to cluster dest; bucket b; prefix p/; }
#         # action log { level info; }
#         # action set { metadata key value; };
#     }
#     # rule { match { ... } action pass; }
# }
#
# Built-ins: drop-all, default (always present).
# Wildcards and '!' prefix supported in filters.
# ---------------------------------------------------------------------------

# policy example {
#     rule {
#         match { source.bucket "*"; size >= 1M; }
#         action accept;
#     }
# }
