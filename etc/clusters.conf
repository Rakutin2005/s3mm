cluster minio1 {
    addr http://127.0.0.1:19000;
    alias minio1;
    vendor minio;
    credential minio-admin;
    location us-east-1;
    path_style on;
    insecure on;
}

cluster rustfs1 {
    addr http://127.0.0.1:9000;
    alias rustfs1;
    vendor rustfs;
    credential rustfs-admin;
    location us-east-1;
    path_style on;
    insecure on;
}

cluster rustfs2 {
    addr http://127.0.0.1:29000;
    alias rustfs2;
    vendor rustfs;
    credential rustfs2-admin;
    location us-east-1;
    path_style on;
    insecure on;
}
