version: "3.8"
services:
  rustfs1:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "29200:9000"
      - "29201:9001"
    volumes:
      - rustfs1-data:/data

  rustfs2:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: r2admin
      RUSTFS_SECRET_KEY: r2admin123
    ports:
      - "29202:9000"
      - "29203:9001"
    volumes:
      - rustfs2-data:/data

  minio1:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "29204:9000"
      - "29205:9001"
    volumes:
      - minio1-data:/data

  s3mmd:
    build:
      context: .
      dockerfile: Dockerfile.s3mm
    command: ["/usr/local/bin/s3mmd", "-c", "/etc/s3mm/s3mm.conf"]
    volumes:
      - ./docker/etc2:/etc/s3mm
    depends_on:
      - rustfs1
      - rustfs2
      - minio1

  s3mmws:
    build:
      context: .
      dockerfile: Dockerfile.s3mm
    command: ["/usr/local/bin/s3mmws", "-c", "/etc/s3mm/s3mm.conf", "-l", "0.0.0.0", "-p", "8080"]
    ports:
      - "8083:8080"
      - "9444:9443"
    volumes:
      - ./docker/etc2:/etc/s3mm
    depends_on:
      - s3mmd

volumes:
  rustfs1-data:
  rustfs2-data:
  minio1-data:
